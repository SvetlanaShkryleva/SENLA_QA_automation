name: Test Automation with Allure Report

on:
  schedule:
    - cron: '0 6 * * *'   # 09:00 МСК
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: cucumber

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Maven
        shell: powershell
        run: mvn -version

      - name: Create credentials.properties from secrets
        shell: powershell
        run: |
          $lines = @(
            "username=${{ secrets.APP_USERNAME }}",
            "password=${{ secrets.APP_PASSWORD }}",
            "baseUrl=${{ secrets.BASE_URL }}",
            "db.url=${{ secrets.DB_URL }}",
            "db.user=${{ secrets.DB_USER }}",
            "db.password=${{ secrets.DB_PASSWORD }}"
          )
          New-Item -ItemType Directory -Force -Path "src/test/resources" | Out-Null
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllLines("$PWD\src\test\resources\credentials.properties", $lines, $utf8NoBom)

      - name: Verify credentials file (no secrets shown)
        shell: powershell
        run: |
          $file = "src/test/resources/credentials.properties"
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\$file")
          $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
          Write-Host "Has BOM: $hasBom (must be False)"
          Get-Content $file | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts.Length -eq 2) { Write-Host "  $($parts[0]) -> length $($parts[1].Length)" }
          }

      - name: Run Tests (headless)
        shell: powershell
        env:
          HEADLESS: "true"
        run: mvn -B clean test

      - name: Generate Allure Report
        if: always()
        shell: powershell
        run: mvn -B allure:report

      - name: Zip Allure Report
        if: always()
        shell: powershell
        run: |
          if (Test-Path "target\site\allure-maven-plugin") {
            Compress-Archive -Path "target\site\allure-maven-plugin\*" -DestinationPath "allure-report.zip" -Force
          }

      - name: Send Email with Allure Report
        if: always()
        shell: powershell
        run: |
          $mail = New-Object System.Net.Mail.MailMessage
          $mail.From = New-Object System.Net.Mail.MailAddress("${{ secrets.SMTP_USERNAME }}")
          $mail.To.Add("${{ secrets.EMAIL_TO }}")
          $mail.Subject = "Отчет о тестах: сборка #${{ github.run_number }} - ${{ job.status }}"
          $mail.SubjectEncoding = [System.Text.Encoding]::UTF8

          $body = @"
          <h2>Результаты автотестов</h2>
          <p><b>Проект:</b> ${{ github.repository }}</p>
          <p><b>Номер сборки:</b> ${{ github.run_number }}</p>
          <p><b>Статус:</b> ${{ job.status }}</p>
          <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Открыть запуск в GitHub Actions</a></p>
          <p>Полный HTML-отчёт Allure во вложении.</p>
          "@
          $mail.Body = $body
          $mail.BodyEncoding = [System.Text.Encoding]::UTF8
          $mail.IsBodyHtml = $true

          if (Test-Path "allure-report.zip") {
            $attachment = New-Object System.Net.Mail.Attachment("allure-report.zip")
            $mail.Attachments.Add($attachment)
          }

          $smtp = New-Object System.Net.Mail.SmtpClient("${{ secrets.SMTP_SERVER }}", [int]"${{ secrets.SMTP_PORT }}")
          $smtp.EnableSsl = $true
          $smtp.Credentials = New-Object System.Management.Automation.PSCredential(
            "${{ secrets.SMTP_USERNAME }}",
            (ConvertTo-SecureString "${{ secrets.SMTP_PASSWORD }}" -AsPlainText -Force)
          )
          $smtp.Send($mail)