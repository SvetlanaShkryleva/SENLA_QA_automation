name: Test Automation with Allure Report

on:
  schedule:
    - cron: '0 6 * * *'   # 09:00 МСК
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: cucumber

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Maven
        shell: powershell
        run: mvn -version

      - name: Create credentials.properties from secrets
        shell: powershell
        run: |
          $lines = @(
            "username=${{ secrets.APP_USERNAME }}",
            "password=${{ secrets.APP_PASSWORD }}",
            "baseUrl=${{ secrets.BASE_URL }}",
            "db.url=${{ secrets.DB_URL }}",
            "db.user=${{ secrets.DB_USER }}",
            "db.password=${{ secrets.DB_PASSWORD }}"
          )
          New-Item -ItemType Directory -Force -Path "src/test/resources" | Out-Null
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllLines("$PWD\src\test\resources\credentials.properties", $lines, $utf8NoBom)

      - name: Verify credentials file (no secrets shown)
        shell: powershell
        run: |
          $file = "src/test/resources/credentials.properties"
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\$file")
          $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
          Write-Host "Has BOM: $hasBom (must be False)"
          Get-Content $file | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts.Length -eq 2) { Write-Host "  $($parts[0]) -> length $($parts[1].Length)" }
          }

      - name: Run Tests - Phase 1 (create data)
        shell: powershell
        env:
          HEADLESS: "true"
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          mvn -B clean test -Dtest="MarriageRegistrationTest,DeathRegistrationTest,BirthRegistrationTest,CucumberRunnerTest,MarriageApplicationApiTest,AdminRegistrationApiTest,AdminRegistrationWithDbTest,ApplicationProcessApiTest"

      - name: Run Tests - Phase 2 (verify data)
        if: always()
        shell: powershell
        env:
          HEADLESS: "true"
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          mvn -B test -Dtest="ApplicationStatusApiTest,ApplicationsListApiTest,AdminStatusCheckTest,AdminDbVerifyTest"
      - name: Debug - check allure results
        if: always()
        shell: powershell
        run: |
          $path = "target/allure-results"
          if (Test-Path $path) {
            $files = Get-ChildItem $path
            Write-Host "=== Files in $path : $($files.Count) ==="
            $files | ForEach-Object { Write-Host "  $($_.Name)  ($($_.Length) bytes)" }
            $resultFiles = $files | Where-Object { $_.Name -like "*-result.json" }
            Write-Host "=== *-result.json files: $($resultFiles.Count) ==="
          } else {
            Write-Host "!!! $path does not exist !!!"
          }
      - name: Generate Allure Report
        if: always()
        shell: powershell
        run: mvn -B allure:report

      - name: Zip Allure Report
        if: always()
        shell: powershell
        run: |
          if (Test-Path "target\site\allure-maven-plugin") {
            Compress-Archive -Path "target\site\allure-maven-plugin\*" -DestinationPath "allure-report.zip" -Force
            Write-Host "Zipped: allure-report.zip"
          } else {
            Write-Host "Allure report directory not found - skipping zip"
          }

      - name: Send Email with Allure Report
        if: always()
        shell: powershell
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          # Явно читаем скрипт как UTF-8, независимо от локали Windows
          $scriptPath = ".\scripts\send-email.ps1"
          $content = [System.IO.File]::ReadAllText(
              (Resolve-Path $scriptPath),
              [System.Text.Encoding]::UTF8
          )

          # Сохраняем во временный файл с UTF-8 BOM, чтобы PowerShell 5.1
          # гарантированно прочитал его как UTF-8
          $temp = Join-Path $env:TEMP "send-email-exec.ps1"
          $utf8Bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText($temp, $content, $utf8Bom)

          # Запускаем
          & $temp -RunNumber "${{ github.run_number }}" -Status "${{ job.status }}" -RunId "${{ github.run_id }}"